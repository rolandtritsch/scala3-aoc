version = "3.11.5"

runner.dialect = scala3

project.includePaths = ["glob:**.scala", "glob:**.sbt", "glob:**.sc", "glob:**.mill"]
project.excludePaths = []
project.git = false

maxColumn = 100

indent.main = 2
indent.matchSite = 2
indent.caseSite = 2

align.preset = some
align.stripMargin = true

assumeStandardLibraryStripMargin = true

newlines.source = fold
newlines.topLevelStatementBlankLines = [{
  blanks {
    before = 1,
    after = 1,
    beforeEndMarker = 0,
  }
}]
rewrite.rules = [RedundantBraces]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
// FunctionEndMarkers in Scalafix owns the exact function-length rule.
// Scalafmt counts annotations in its span and would conflict with that rule.
rewrite.scala3.endMarker.insert.breaks.min = -1
rewrite.scala3.endMarker.remove.breaks.max = -1
rewrite.trailingCommas.style = multiple
rewrite.trailingCommas.allowFolding = true
