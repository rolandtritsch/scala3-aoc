rules = [
  CollectHeadOption,
  DisableSyntax,
  "file:.scalafix/FunctionEndMarkers.scala",

  // io.github.migiside/zio-scalafix is not published to Maven Central, so
  // these are loaded as raw source and compiled at lint time. Pinned to a
  // commit SHA (not `master`) for reproducibility. See
  // https://github.com/migiside/zio-scalafix for rule descriptions; bump
  // the SHA deliberately, don't float on a branch.
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOAs.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOIgnore.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOMapBoth.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIONone.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOOrElseFail.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOSome.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOUnit.scala",
  "https://raw.githubusercontent.com/migiside/zio-scalafix/f00daf404dc29225cd475219e6b9077dda23712f/rules/src/main/scala/io/github/migiside/fix/PreferZIOZipRight.scala",
  ExplicitResultTypes,
  LeakingImplicitClassVal,
  NoAutoTupling,
  NoValInForComprehension,
  OrganizeImports,
  // ProcedureSyntax,
  RedundantSyntax,
  RemoveUnused,

  AddExplicitImplicitTypes,
  AddLambdaParamParentheses,
  // CatsToValid,
  CirceCodec,
  CollectHeadOption,
  CollectHead,
  CompareSameValue,
  DirectoryAndPackageName,
  // DiscardSingleConfig,
  DiscardValue,
  DuplicateWildcardImport,
  EitherFold,
  EitherGetOrElse,
  EitherMap,
  EtaExpand,
  ExplicitImplicitTypes,
  ExtendsProductWithSerializable,
  FileNameConsistent,
  FilterNot,
  FilterSize,
  FinalObjectWarn,
  FlatMapCollect,
  FlatTraverse,
  // ForTupleMatch,
  GroupMap,
  ImplicitValueClass,
  IncorrectScaladocParam,
  InterpolationToString,
  InterpolationToStringWarn,
  IsEmptyNonEmpty,
  JavaURLConstructorsWarn,
  KeySet,
  KindProjector,
  LambdaParamParentheses,
  LazyZip,
  MapDistinctSize,
  MapFlattenFlatMap,
  MapSequenceTraverse,
  MapToForeach,
  // MatchParentheses,
  NamedParamOrder,
  NoElse,
  ObjectFinal,
  ObjectSelfType,
  OptionContains,
  OptionFilter,
  OptionForallExists,
  OptionGetOrElse,
  OptionGetWarn,
  OptionMapFlatMap,
  OptionMatchToRight,
  OptionOrElse,
  OptionWhenUnless,
  PartialFunctionCondOpt,
  RedundantCaseClassVal,
  RemoveEmptyObject,
  RemoveIf,
  RemovePureEff,
  RemoveSamePackageImport,
  RemoveStringInterpolation,
  RemoveUselessParamComments,
  RepeatedRewrite,
  ReplaceFill,
  ReplacePlaceholder,
  ReplaceSymbolLiterals,
  ReuseInstances,
  SameParamOverloading,
  Scala3ImportRewrite,
  Scala3ImportWarn,
  Scala3Placeholder,
  ScalaApp,
  ScalazEitherInfix,
  // SeparateEachFileConfig,
  SeparateEachFileRewrite,
  SeparateEachFileWarn,
  SimplifyForYield,
  SizeToLength,
  SlickFilter,
  StringFormatToInterpolation,
  SyntacticOrganizeImports,
  ThrowableToNonFatal,
  UnmooredDocComment,
  UnnecessaryCase,
  UnnecessaryMatch,
  UnnecessarySortRewrite,
  UnnecessarySort,
  UnusedConstructorParams,
  UnusedTypeParams,
  UselessParamCommentsWarn,
  // UsingParamAnonymousConstructor,
  // UsingParamAnonymous,
  WithFilter,
  // WithLeftWithRight,
]

OrganizeImports {
  groupedImports = Explode
  expandRelative = true
  removeUnused = false
  groups = [
    "re:javax?\\."
    "scala."
    "scala.meta."
    "*",
  ]
}

OrganizeImports.targetDialect = Scala3

ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true

// Machine-enforced subset of the AGENTS.md "no var" / functional-style
// guardrails.
DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noReturns = true
  noWhileLoops = true
}
