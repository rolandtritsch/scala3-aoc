name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        year: ['0000', '2015', '2016']
    defaults:
      run:
        working-directory: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - name: Check formatting
        run: sbt --batch 'scalafmtCheckAll; scalafmtSbtCheck'
      - name: Build and run every test suite
        run: sbt --batch 'clean; compile; testOnly *'
      - name: Check scalafix rules
        run: sbt --batch 'scalafixAll --check'
      - name: Test end-marker lint rule
        run: python3 ../scripts/test_function_end_markers.py .
